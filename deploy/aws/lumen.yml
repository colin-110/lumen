AWSTemplateFormatVersion: "2010-09-09"
Description: Lumen backend on one Graviton instance - API, Postgres, Redis, Qdrant and Caddy via Docker Compose

Parameters:
  InstanceType:
    Type: String
    Default: t4g.small
    Description: Graviton (arm64). 2 GB is the measured minimum for the low-memory profile.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: A public subnet in an AZ that offers the instance type (us-east-1e has no t4g).
  RepoUrl:
    Type: String
    Default: https://github.com/colin-110/lumen.git
  Branch:
    Type: String
    Default: main
  VolumeSize:
    Type: Number
    Default: 20
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/arm64/hvm/ebs-gp3/ami-id

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # Session Manager and Run Command instead of SSH: no port 22, no key pair.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: lumen-parameters
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ssm:GetParameter, ssm:PutParameter]
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/lumen/*

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lumen - HTTP and HTTPS only
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: ACME challenge and redirect }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: API over HTTPS }
      Tags: [{ Key: Name, Value: lumen-web }]

  ElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags: [{ Key: Name, Value: lumen }]

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!Ref WebSecurityGroup]
      # Standard, not the T-family default "unlimited": sustained CPU throttles
      # to baseline instead of billing surplus credits.
      CreditSpecification: { CPUCredits: standard }
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2   # containers are one hop further away
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs: { VolumeSize: !Ref VolumeSize, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags: [{ Key: Name, Value: lumen-backend }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/lumen-bootstrap.log) 2>&1
          mkdir -p /etc/lumen
          printf 'LUMEN_DOMAIN=%s.nip.io\nAWS_REGION=%s\n' "${ElasticIp}" "${AWS::Region}" > /etc/lumen/host.env
          test -d /opt/lumen/.git || git clone --branch "${Branch}" "${RepoUrl}" /opt/lumen
          bash /opt/lumen/deploy/aws/setup.sh

  IpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

Outputs:
  PublicIp:
    Value: !Ref ElasticIp
  ApiUrl:
    Value: !Sub https://${ElasticIp}.nip.io/api/v1
  InstanceId:
    Value: !Ref Instance
