<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Matches the in-app logo: the same sparkle on the same brand gradient
       (--grad-1/2/3 in globals.css), so the tab icon and the sidebar mark
       read as one identity. Hard-coded rather than referencing CSS vars
       because a favicon is rendered outside the document. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3aa9ff"/>
      <stop offset="55%" stop-color="#7c6bff"/>
      <stop offset="100%" stop-color="#e05cd9"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <!-- Four-point sparkle. Concave sides keep the points crisp at 16px, where
       a straight-edged diamond turns to mush. -->
  <path
    fill="#fff"
    d="M32 12c1.2 8.1 3.7 12.3 8.5 14.6C45 28.7 47.8 29.5 52 30c-4.2.5-7 1.3-11.5 3.4C35.7 35.7 33.2 39.9 32 48c-1.2-8.1-3.7-12.3-8.5-14.6C19 31.3 16.2 30.5 12 30c4.2-.5 7-1.3 11.5-3.4C28.3 24.3 30.8 20.1 32 12Z"
  />
  <!-- Smaller companion sparkle, mirroring the lucide icon used in the UI. -->
  <circle cx="47" cy="17" r="3.2" fill="#fff" opacity=".9"/>
</svg>
