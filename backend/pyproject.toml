[tool.poetry]
name = "lumen-backend"
version = "1.0.0"
description = "Lumen document assistant — backend"
authors = ["Colin Thomas <colinkthomas110@gmail.com>"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "^0.115.5"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
alembic = "^1.14.0"
asyncpg = "^0.30.0"
pydantic = {extras = ["email"], version = "^2.9.2"}
pydantic-settings = "^2.6.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
bcrypt = "^4.2.1"
python-multipart = "^0.0.17"
redis = {extras = ["hiredis"], version = "^5.2.0"}
celery = "^5.4.0"

# --- RAG / agent orchestration ---
# Deliberately no langchain/langgraph here: conversation state is persisted
# in Postgres via our own Conversation/Message models (queryable, paginable,
# displayable in the UI — a checkpointer alone gives none of that), and
# litellm's native async streaming + function-calling is used directly
# instead of a framework wrapper around it. Fewer moving parts, fewer
# version-compat surfaces, faster cold start.
litellm = "^1.52.6"

# --- retrieval (all ONNX-based: no torch, fast cold start, CPU-friendly) ---
qdrant-client = "^1.12.1"
fastembed = "^0.4.2"

# --- document parsing ---
pymupdf = "^1.24.13"
python-docx = "^1.1.2"
# OCR fallback for scanned/image-only PDF pages (see document_parser.py).
# Needs the `tesseract-ocr` system binary — installed in the runtime stage
# of the Dockerfile, not a Python dependency.
pytesseract = "^0.3.13"
# Pinned <11 to satisfy fastembed's own pillow constraint (>=10.3.0,<11.0.0)
# — a real version conflict poetry's resolver caught in CI.
pillow = "^10.3.0"

# --- storage / observability ---
boto3 = "^1.35.63"
prometheus-client = "^0.21.0"
tenacity = "^9.0.0"
httpx = "^0.27.2"

[tool.poetry.group.dev.dependencies]
# Sync Postgres driver, for `SYNC_DATABASE_URI`. A dev dependency, not a
# runtime one: alembic drives migrations through `async_engine_from_config`
# on the asyncpg URL (see alembic/env.py), so nothing in the running image
# ever imports psycopg. It was costing 19MB of site-packages plus the libpq5
# apt package in the runtime layer, for the sake of the test fixtures that
# are its only caller.
psycopg = {extras = ["binary", "pool"], version = "^3.2.3"}
pytest = "^8.3.3"
# >=0.26 for `asyncio_default_test_loop_scope`. Without it every test gets a
# fresh event loop while the async DB engine is a module-level singleton, so
# its pooled asyncpg connections outlive the loop that created them and the
# second test to touch the database dies with "Event loop is closed" — the
# same failure the Celery worker hit, for the same reason (see
# core/celery_app.run_async).
pytest-asyncio = ">=0.26,<2.0"
httpx = "^0.27.2"
# ruff formats as well as lints, so black was a second formatter that nothing
# invoked — `make lint` only ever ran `ruff check`. Removed rather than left
# as a dependency implying a formatting standard that was not applied.
ruff = "^0.7.4"
pre-commit = "^4.0.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

# Without an explicit `select`, ruff runs only its default E4/E7/E9/F set —
# no import sorting, no bugbear, no pyupgrade. The code was already written
# against a stricter standard than that: five `# noqa` directives in the tree
# suppressed BLE001, N805 and T201, none of which were enabled, so those
# suppressions did nothing at all. This makes the configuration match the
# intent the code already expressed.
[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear — mutable defaults, zip() without strict, ...
    "C4",       # comprehension simplifications
    "UP",       # pyupgrade
    "SIM",      # simplifications
    "RET",      # return-path clarity
    "PTH",      # pathlib over os.path
    "RUF",      # ruff's own rules, incl. RUF100 unused-noqa
    "T20",      # stray print/pprint
]
ignore = [
    "E501",     # line length is enforced by the formatter, not the linter
    "B008",     # FastAPI's whole dependency idiom is a call in a default
    "RET504",   # a named result before `return` is often the clearer read
    # BLE001 (blind except) is deliberately NOT enabled. Degrading instead of
    # raising is this codebase's stated policy for everything auxiliary — the
    # semantic cache, web search, object storage and the metrics sweep all
    # catch broadly, log, and let the request continue. The rule fired 13
    # times, every one of them on an intentional catch that already carries a
    # comment explaining it. A rule suppressed thirteen times is noise, not a
    # guardrail.
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately reach into private helpers and assert on internals.
"tests/*" = ["S101", "SLF001", "BLE001"]
# The eval harness is a CLI: printing is its output, not a stray debug line.
"app/evaluation/*" = ["T20"]
"scripts/*" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session, matching how the app actually runs.
# See the pytest-asyncio pin above for why this is not optional here.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: exercises the API against a real Postgres and Redis; skipped automatically when they are unreachable",
]
