[tool.poetry]
name = "lumen-backend"
version = "1.0.0"
description = "Lumen document assistant — backend"
authors = ["Colin Thomas <colinkthomas110@gmail.com>"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "^0.115.5"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
alembic = "^1.14.0"
asyncpg = "^0.30.0"
psycopg = {extras = ["binary", "pool"], version = "^3.2.3"}
pydantic = {extras = ["email"], version = "^2.9.2"}
pydantic-settings = "^2.6.1"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
bcrypt = "^4.2.1"
python-multipart = "^0.0.17"
redis = {extras = ["hiredis"], version = "^5.2.0"}
celery = "^5.4.0"

# --- RAG / agent orchestration ---
# Deliberately no langchain/langgraph here: conversation state is persisted
# in Postgres via our own Conversation/Message models (queryable, paginable,
# displayable in the UI — a checkpointer alone gives none of that), and
# litellm's native async streaming + function-calling is used directly
# instead of a framework wrapper around it. Fewer moving parts, fewer
# version-compat surfaces, faster cold start.
litellm = "^1.52.6"

# --- retrieval (all ONNX-based: no torch, fast cold start, CPU-friendly) ---
qdrant-client = "^1.12.1"
fastembed = "^0.4.2"

# --- document parsing (lightweight, no poppler/tesseract system deps) ---
pymupdf = "^1.24.13"
python-docx = "^1.1.2"

# --- storage / observability ---
boto3 = "^1.35.63"
prometheus-client = "^0.21.0"
tenacity = "^9.0.0"
httpx = "^0.27.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.2"
ruff = "^0.7.4"
black = "^24.10.0"
pre-commit = "^4.0.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
