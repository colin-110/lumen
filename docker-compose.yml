services:
  db:
    image: postgres:15
    container_name: enterprise_ai_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7
    container_name: enterprise_ai_redis
    # Host port remapped to 6380 to avoid clashing with a Redis instance
    # that might already be running on the host; containers still talk to
    # each other over the standard 6379 on the internal docker network.
    # Also doubles as the Celery broker/result backend (DB 1) — no
    # separate message broker service needed.
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterprise_ai_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 512m

  minio:
    image: minio/minio:latest
    container_name: enterprise_ai_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    # Host ports remapped (9005/9006) for the same reason as redis above.
    ports:
      - "9005:9000"
      - "9006:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

  backend:
    build: ./backend
    image: lumen-backend:latest
    container_name: enterprise_ai_backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      # Overridable so a real deployment can set ENVIRONMENT=production in
      # backend/.env; a hardcoded value here silently wins over the env file.
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - POSTGRES_SERVER=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - QDRANT_URL=http://qdrant:6333
      - S3_ENDPOINT_URL=http://minio:9000
      # Scale via replicas, not in-process workers — one model copy per
      # process, so this is the biggest single lever on backend RAM. Bump
      # this (and add more CPU) for real production traffic.
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 900m

  worker:
    # Reuses the backend service's build instead of building its own
    # near-identical ~1.7GB image from the same Dockerfile/deps — only the
    # `command` differs, so one built image serves both roles.
    image: lumen-backend:latest
    container_name: enterprise_ai_worker
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--concurrency=2", "-Q", "ingestion"]
    env_file:
      - backend/.env
    environment:
      # Overridable so a real deployment can set ENVIRONMENT=production in
      # backend/.env; a hardcoded value here silently wins over the env file.
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - POSTGRES_SERVER=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - QDRANT_URL=http://qdrant:6333
      - S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Measured at ~697MB against a 700m cap after ingesting a handful of
          # documents — i.e. essentially at the ceiling, where the next large
          # PDF gets the container OOM-killed mid-task. Celery's acks_late
          # would requeue it, so it would retry and die again rather than fail
          # loudly. 900m matches the backend and leaves real headroom.
          memory: 900m

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: enterprise_ai_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 200m

  prometheus:
    image: prom/prometheus:latest
    container_name: enterprise_ai_prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 200m

  grafana:
    # grafana-oss excludes the bundled enterprise plugins/features this
    # project never uses — meaningfully smaller image for the same
    # dashboards, since only Prometheus is wired up as a datasource here.
    image: grafana/grafana-oss:latest
    container_name: enterprise_ai_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  prometheus_data:
  grafana_data:
