# Host ports for backend and Postgres can be moved if something else already
# uses them: set BACKEND_HOST_PORT / POSTGRES_HOST_PORT in a root .env file.

# Shared by migrate, backend and worker: one image, one config.
x-backend: &backend
  image: lumen-backend:latest
  env_file:
    - backend/.env
  environment: &backend-env
    # Overridable so a real deployment can set ENVIRONMENT=production in
    # backend/.env; a hardcoded value here would silently win over the file.
    ENVIRONMENT: ${ENVIRONMENT:-local}
    POSTGRES_SERVER: db
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    QDRANT_URL: http://qdrant:6333
    # Uploaded files live on a volume shared by backend and worker.
    STORAGE_BACKEND: local
    LOCAL_STORAGE_DIR: /data/documents
  volumes:
    - documents_data:/data/documents
  depends_on: &backend-deps
    # migrate itself waits on a healthy db, so db is covered transitively.
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    qdrant:
      condition: service_started

services:
  db:
    image: postgres:15.10
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_ai}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7.4.1
    # Host port 6380 avoids clashing with a Redis already on the host. Also
    # the Celery broker (DB 1), so no separate message broker is needed.
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

  qdrant:
    # Pin forward, never backward: Qdrant's storage format is not backward
    # compatible, and an older binary panics on a volume a newer one wrote.
    image: qdrant/qdrant:v1.19.0
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    deploy:
      resources:
        limits:
          memory: 512m

  # Runs `alembic upgrade head` once and exits; backend and worker wait on it,
  # so a plain `docker compose up` on a fresh checkout gives a working stack.
  migrate:
    <<: *backend
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512m

  backend:
    <<: *backend
    build: ./backend
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    environment:
      <<: *backend-env
      # Scale with replicas, not in-process workers: each worker loads its own
      # copy of the models, so this is the biggest single lever on RAM.
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 900m

  worker:
    <<: *backend
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "--concurrency=2", "-Q", "ingestion"]
    deploy:
      resources:
        limits:
          # Measured ~697MB after a handful of documents; a tighter cap gets
          # it OOM-killed mid-task, and acks_late would retry it into the
          # same wall.
          memory: 900m

  frontend:
    build:
      context: ./frontend
      args:
        # NEXT_PUBLIC_* is inlined at build time, so it's a build arg only.
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_HOST_PORT:-8000}/api/v1
        # Pre-fills the login form; set DEMO_EMAIL / DEMO_PASSWORD in the root
        # .env to the demo account from backend/.env, or leave unset.
        NEXT_PUBLIC_DEMO_EMAIL: ${DEMO_EMAIL:-}
        NEXT_PUBLIC_DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 200m

  # Monitoring is opt-in: `docker compose --profile monitoring up`.
  # /metrics stays exposed either way for any external scraper.
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.0.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 200m

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana-oss:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  documents_data:
  prometheus_data:
  grafana_data:
