name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest

    # Integration tests exercise the API against a real database and Redis.
    # Without them the suite could only ever cover pure functions, which is
    # how a broken SSE persistence path, an inactive-superuser hole and an
    # organization model that never matched two users all reached main with a
    # green build.
    services:
      postgres:
        image: postgres:15.10
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lumen_test
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: local
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-real
      # Keep tests off the network: no LLM calls, no Qdrant.
      SEMANTIC_CACHE_ENABLED: "false"
      RATE_LIMIT_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pipx install poetry==1.8.5

      # --no-update would be a no-op here; the point is to fail loudly if
      # poetry.lock and pyproject.toml have drifted, rather than silently
      # resolving something different from what gets deployed.
      - name: Verify the lock file is current
        run: cd backend && poetry check --lock

      - name: Install dependencies
        run: cd backend && poetry install --no-interaction

      - name: Run Ruff Linting
        run: cd backend && poetry run ruff check .

      - name: Check formatting
        run: cd backend && poetry run ruff format --check .

      - name: Run migrations
        run: cd backend && poetry run alembic upgrade head

      - name: Run Pytest
        run: cd backend && poetry run pytest -q

  # The Dockerfile was never built in CI, so breakage in it only surfaced at
  # deploy time — which is how a runtime image that could not `import requests`
  # reached production. Building here costs a few minutes and catches it on
  # the PR instead, and the size guard makes an accidental bloat visible as a
  # failure rather than a slow drift nobody measures.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -t lumen-backend:ci ./backend
      - name: Smoke-test the built image
        run: |
          set -euo pipefail
          docker run --rm lumen-backend:ci python -c "
          import app.main, requests, fastembed, litellm  # noqa: F401
          print('imports OK')
          "
          docker run --rm lumen-backend:ci alembic --help >/dev/null
          echo 'alembic entrypoint OK'
      - name: Guard the image size
        run: |
          set -euo pipefail
          BYTES=$(docker image inspect lumen-backend:ci --format '{{.Size}}')
          MB=$((BYTES / 1024 / 1024))
          echo "backend image: ${MB} MB"
          # 916MB before the slimming pass, 750MB after (787MB as `docker
          # images` reports it on the deploy host, which counts layers
          # differently). The ceiling sits just above the measured size so
          # that growth has to be justified rather than drifting unnoticed.
          LIMIT=800
          if [ "$MB" -gt "$LIMIT" ]; then
            echo "::error::image grew to ${MB}MB, over the ${LIMIT}MB budget"
            exit 1
          fi

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20: jsdom + undici's CacheStorage throws on Node 20
          # under Vitest. Next.js 16 requires >=20.9, so 22 is in range.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run Linting
        run: cd frontend && npm run lint
      - name: Typecheck
        run: cd frontend && npx tsc --noEmit
      - name: Run Vitest
        run: cd frontend && npm test
      - name: Build Next.js
        run: cd frontend && npm run build
