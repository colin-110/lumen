name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: cd backend && poetry install
      - name: Run Ruff Linting
        run: cd backend && poetry run ruff check .
      - name: Run Pytest
        run: cd backend && poetry run pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 22, not 20: jsdom + undici's CacheStorage throws on Node 20
          # under Vitest. Next.js 16 requires >=20.9, so 22 is in range.
          node-version: '22'
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run Linting
        run: cd frontend && npm run lint
      - name: Run Vitest
        run: cd frontend && npm test
      - name: Build Next.js
        run: cd frontend && npm run build
