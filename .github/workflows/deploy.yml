name: Deploy

# Runs only after CI succeeds on main, so a red build never reaches the box.
# A push straight to main still gets linted and tested first — this workflow
# is triggered by CI's completion, not by the push.
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  # Manual re-deploy without pushing a commit (rollbacks, config changes).
  workflow_dispatch:

concurrency:
  # Never let two deploys race on the same instance.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires on failure too; only proceed when CI actually passed.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Deploy over SSM rather than SSH. The instance needs no inbound port
      # open at all — the SSM agent polls outbound — so CD doesn't force
      # port 22 open to GitHub's dynamic runner IP ranges.
      - name: Deploy over SSM
        id: send
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 1200 \
            --parameters 'commands=[
              "set -euo pipefail",
              "cd /home/ec2-user/lumen",
              "git fetch --quiet origin main",
              "git reset --hard origin/main",
              "CF=\"-f docker-compose.yml -f docker-compose.free-tier.yml -f docker-compose.ec2.yml -f docker-compose.caddy.yml\"",
              "sudo -u ec2-user docker compose $CF build",
              "sudo -u ec2-user docker compose $CF up -d",
              "sudo -u ec2-user docker compose $CF exec -T backend alembic upgrade head",
              "sudo -u ec2-user docker image prune -f"
            ]' \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "Dispatched SSM command $CMD_ID"

      - name: Wait for the deploy to finish
        run: |
          set -euo pipefail
          CMD_ID="${{ steps.send.outputs.command_id }}"
          for _ in $(seq 1 80); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
              --query 'Status' --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) echo "Deploy succeeded"; break ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy $STATUS"
                aws ssm get-command-invocation --command-id "$CMD_ID" \
                  --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
                  --query 'StandardErrorContent' --output text | tail -40
                exit 1 ;;
              *) sleep 15 ;;
            esac
          done
          [ "$STATUS" = "Success" ] || { echo "Timed out waiting for SSM"; exit 1; }

      # A green deploy that serves 500s is not a green deploy.
      - name: Smoke test the live site
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://3-218-31-157.nip.io/health || echo 000)
            if [ "$CODE" = "200" ]; then
              curl -s --max-time 20 https://3-218-31-157.nip.io/health
              echo "  frontend: $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://3-218-31-157.nip.io)"
              exit 0
            fi
            echo "health=$CODE, retrying ($i/20)"; sleep 15
          done
          echo "Site did not come back healthy after deploy"; exit 1
