name: Build and Push Backend Image

# Runs after CI Pipeline succeeds on main, not on every push directly - a
# broken build shouldn't get pushed as a taggable image any more than it
# should get deployed. workflow_run is how you gate one workflow on another
# finishing green; a plain `on: push` here would race CI instead of waiting
# on it.
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed to push to GHCR under this repo's own namespace - the default
      # GITHUB_TOKEN covers this, no separate PAT to create or rotate.
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          # :latest for the deploy script to pull, plus the commit SHA so a
          # specific build is always identifiable/rollback-able later.
          tags: |
            ghcr.io/${{ github.repository_owner }}/lumen-backend:latest
            ghcr.io/${{ github.repository_owner }}/lumen-backend:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
