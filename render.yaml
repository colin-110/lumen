# Render Blueprint for the backend only — the free managed-services deploy
# path documented in README.md under "Deploying". Frontend goes to Vercel
# separately (zero-config for Next.js, no blueprint needed); Postgres/Qdrant/
# object storage are managed elsewhere (Neon/Qdrant Cloud/R2) and wired in
# below as vars you fill in on first deploy.
#
# Redis/Upstash IS wired in below. REDIS_URL only backs rate limiting
# (app/core/rate_limit.py) — the semantic cache is Qdrant-backed, not Redis —
# and that code fails *open* on any Redis error (logs a warning, lets the
# request through) rather than erroring, so it's not a hard dependency. But
# this deploy runs with ALLOW_OPEN_REGISTRATION=true (the default) as a
# public demo link, which makes real per-user rate limiting worth the one
# extra free account: Upstash's free tier is 256MB / 500k commands/month,
# no card. Get the rediss:// URL from Upstash (Redis -> your DB -> TCP tab)
# and paste it in during the Blueprint prompt.
#
# `sync: false` means "set this in the Render dashboard, not in git" — every
# such var is a secret or a value unique to your managed-service accounts.
#
# Render's free web service plan is 512 MB RAM. The 1GB-host numbers in the
# README ("Running on a 1GB host") don't directly apply here - measured live
# on this deploy: ONNX_DISABLE_MEM_ARENA alone wasn't enough (OOM loading the
# third model), RERANK_ENABLED=false was needed on top of it, and even then
# ingesting a real document OOM'd until EMBED_BATCH_SIZE came down too. All
# three below are load-bearing, not precautionary - confirmed by an actual
# crash-loop, not guessed. RETRIEVE_CANDIDATES only affects per-query memory
# during a request, not model-load or ingestion memory, so it won't help if
# this still OOMs - EMBED_BATCH_SIZE lower than 8, or a paid plan, are the
# next real levers.
services:
  - type: web
    name: lumen-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      # NOT "true" here on purpose. Strict mode promotes every warning below
      # to a hard startup failure, including ALLOW_OPEN_REGISTRATION=true --
      # which is exactly what a public/recruiter-facing demo needs. The
      # README says as much: don't turn strict mode on for a public demo.
      # Warnings still print to the Render logs either way.
      - key: STRICT_PRODUCTION_CHECKS
        value: "false"

      # --- RAM: same trade-offs as docker-compose.free-tier.yml -----------
      - key: INGEST_INLINE
        value: "true"
      - key: UVICORN_WORKERS
        value: "1"
      - key: ONNX_THREADS
        value: "1"
      - key: RETRIEVE_CANDIDATES
        value: "20"
      # Disables onnxruntime's pre-allocated memory arena per session so each
      # model only holds what it actually uses, trading some inference
      # latency for lower peak RSS at load time. Kept even with the reranker
      # off below - still real headroom for dense+sparse alone.
      - key: ONNX_DISABLE_MEM_ARENA
        value: "true"
      # Confirmed necessary, not precautionary: 512MB OOMed loading all three
      # ONNX models even with ONNX_DISABLE_MEM_ARENA above - dense+sparse
      # alone were already close to the ceiling. This drops the third model
      # (the cross-encoder reranker) entirely rather than shrinking it,
      # trading real retrieval quality for actually fitting the free plan.
      # See RERANK_ENABLED's comment in core/config.py for the eval numbers.
      - key: RERANK_ENABLED
        value: "false"
      # Confirmed necessary too: ingesting a real uploaded document (batches
      # of 64 chunks through the dense+sparse encoders, on top of the two
      # models already resident) OOM'd even after the reranker was dropped.
      # Unlike RERANK_ENABLED, this costs no quality - smaller batches just
      # mean more, smaller passes through the same models, slower but
      # identical output. Default (64) stays fine on the free-tier compose
      # profile, which has real headroom; only this constrained a deploy
      # needs it this low.
      - key: EMBED_BATCH_SIZE
        value: "8"

      # --- secrets: generated for you ------------------------------------
      - key: SECRET_KEY
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true

      # --- Render sits in front as the reverse proxy ----------------------
      - key: TRUSTED_PROXY_HEADERS
        value: "true"

      # --- fill in on first deploy: your Vercel URL ------------------------
      - key: BACKEND_CORS_ORIGINS
        sync: false # e.g. https://your-app.vercel.app

      # --- fill in on first deploy: Neon (Settings -> Connection Details) --
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SERVER
        sync: false # the Neon host, not "localhost"
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_SSL_MODE
        value: require

      # --- fill in on first deploy: Upstash (Redis -> your DB -> TCP tab) -
      - key: REDIS_URL
        sync: false # rediss://... (note the TLS scheme)

      # --- fill in on first deploy: Qdrant Cloud cluster -------------------
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false

      # --- fill in on first deploy: Cloudflare R2 bucket -------------------
      - key: S3_ENDPOINT_URL
        sync: false # https://<account_id>.r2.cloudflarestorage.com
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto

      # --- fill in on first deploy: at least one LLM key -------------------
      - key: GEMINI_API_KEY
        sync: false

      # --- generated for you; read it back from the Render dashboard to log in ---
      - key: FIRST_SUPERUSER_PASSWORD
        generateValue: true
